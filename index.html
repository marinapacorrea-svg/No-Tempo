<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F5AD6">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="No Tempo">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="No Tempo: descubra que horas acordar e sair para chegar no horário. Protótipo com dados simulados.">
<title>No Tempo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: coluna única de celular (máx. 480px) centralizada; barra inferior fixa; horários em fonte display com números tabulares. */
:root{
  --bg:#F3F5F9; --surface:#FFFFFF; --surface-2:#F7F9FC; --ink:#0F1B2D; --muted:#566275; --faint:#8792A3; --line:#E1E6EE;
  --blue:#1F5AD6; --blue-ink:#1646A8; --blue-soft:#E7EEFC; --on-blue:#FFFFFF; --hero:#1F5AD6; --hero-line:rgba(255,255,255,.22); --hero-soft:rgba(255,255,255,.14);
  --green:#127A4A; --green-dot:#1FA866; --green-soft:#E2F3E9;
  --yellow:#7E5300; --yellow-dot:#E3A600; --yellow-soft:#FFF2CC;
  --red:#B92D1C; --red-dot:#E0442F; --red-soft:#FCE7E3;
  --scrim:rgba(9,16,28,.48);
  --shadow:0 1px 2px rgba(15,27,45,.05),0 6px 18px rgba(15,27,45,.05);
  --f-display:"Bricolage Grotesque","Figtree",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:20px; --r-sm:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C121B; --surface:#141C28; --surface-2:#18212F; --ink:#E9EEF6; --muted:#A1ACBD; --faint:#768295; --line:#253144;
  --blue:#6C9BFF; --blue-ink:#9DBDFF; --blue-soft:#1A2948; --on-blue:#0B1220; --hero:#2556C4; --hero-line:rgba(255,255,255,.2); --hero-soft:rgba(255,255,255,.12);
  --green:#5BD196; --green-dot:#3EC27F; --green-soft:#11301F;
  --yellow:#F2C75A; --yellow-dot:#E8B02A; --yellow-soft:#33290E;
  --red:#FF8A7A; --red-dot:#F0604C; --red-soft:#3A1713;
  --scrim:rgba(0,0,0,.6); --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark; }}
:root[data-theme="dark"]{
  --bg:#0C121B; --surface:#141C28; --surface-2:#18212F; --ink:#E9EEF6; --muted:#A1ACBD; --faint:#768295; --line:#253144;
  --blue:#6C9BFF; --blue-ink:#9DBDFF; --blue-soft:#1A2948; --on-blue:#0B1220; --hero:#2556C4; --hero-line:rgba(255,255,255,.2); --hero-soft:rgba(255,255,255,.12);
  --green:#5BD196; --green-dot:#3EC27F; --green-soft:#11301F;
  --yellow:#F2C75A; --yellow-dot:#E8B02A; --yellow-soft:#33290E;
  --red:#FF8A7A; --red-dot:#F0604C; --red-soft:#3A1713;
  --scrim:rgba(0,0,0,.6); --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark; }

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue-ink)}
.ic{flex:none;display:block}
.app{max-width:480px;margin:0 auto;padding:14px 16px 128px;min-height:100%}
.app.nonav{padding-bottom:40px}
@media (min-width:760px){ body{background:var(--surface-2)} .app{background:var(--bg);border-left:1px solid var(--line);border-right:1px solid var(--line)} }
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-family:var(--f-display);font-size:26px;font-weight:650;letter-spacing:-.015em;line-height:1.15}
h2{font-family:var(--f-display);font-size:18px;font-weight:600;letter-spacing:-.01em}
h3{font-size:15px;font-weight:650}
p{margin:0}
.eyebrow{font-size:12px;font-weight:650;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)} .faint{color:var(--faint)} .small{font-size:13px} .xs{font-size:12px}
.tnum{font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:12px}
.stack-sm{display:flex;flex-direction:column;gap:6px}
.stack-lg{display:flex;flex-direction:column;gap:16px}
.row{display:flex;align-items:center;gap:10px;min-width:0}
.row.top{align-items:flex-start}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.wrap{flex-wrap:wrap}
.center{text-align:center}

/* Cabeçalho */
.hd{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding-block:6px 4px}
.hd-actions{display:flex;gap:8px;align-items:center}
.iconbtn{width:42px;height:42px;border-radius:14px;border:1px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;position:relative;flex:none}
.iconbtn .badge{position:absolute;top:-4px;right:-4px;min-width:19px;height:19px;padding:0 5px;border-radius:999px;background:var(--red-dot);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid var(--bg)}
.subhd{display:flex;align-items:center;gap:10px;padding-block:4px 8px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
.subhd h1{font-size:20px}
.scen{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 12px 0 10px;border-radius:999px;border:1px dashed var(--line);background:transparent;cursor:pointer;font-size:12.5px;color:var(--muted);font-weight:600}
.scen b{color:var(--ink);font-weight:650}

/* Cards */
.card{background:var(--surface);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);border:1px solid var(--line)}
.card.flat{box-shadow:none}
.card-hd{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.card.tone-red{background:var(--red-soft);border-color:transparent;box-shadow:none}
.card.tone-yellow{background:var(--yellow-soft);border-color:transparent;box-shadow:none}
.card.tone-green{background:var(--green-soft);border-color:transparent;box-shadow:none}
.card.tone-blue{background:var(--blue-soft);border-color:transparent;box-shadow:none}
.tone-red .ttl{color:var(--red)} .tone-yellow .ttl{color:var(--yellow)} .tone-green .ttl{color:var(--green)}

.hero{background:var(--hero);color:#fff;border-radius:24px;padding:20px 18px 16px;position:relative;overflow:hidden}
.hero .eyebrow{color:rgba(255,255,255,.78)}
.hero .big{font-family:var(--f-display);font-size:76px;font-weight:700;letter-spacing:-.035em;line-height:.95;font-variant-numeric:tabular-nums;margin-top:6px}
.hero .big.off{font-size:40px;opacity:.85;letter-spacing:-.01em}
.hero .seal{display:inline-flex;align-items:center;gap:6px;background:var(--hero-soft);border:1px solid var(--hero-line);border-radius:999px;padding:4px 10px;font-size:12.5px;font-weight:600}
.hero .seal.warn{background:#FFE7A3;color:#5C3D00;border-color:transparent}
.hero .cmp{font-size:16px;font-weight:650;margin-top:10px}
.hero .why{color:rgba(255,255,255,.88);margin-top:2px}
.hero .chg{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:12px;padding-top:12px;border-top:1px solid var(--hero-line);font-size:13px;color:rgba(255,255,255,.88)}
.hero .chg s{opacity:.7}
.hero .acts{display:flex;gap:8px;margin-top:14px}
.hero .acts .btn{flex:1}
.btn-hero{background:#fff;color:#123E9C}
.btn-hero2{background:var(--hero-soft);color:#fff;border:1px solid var(--hero-line)}
.hero-arc{position:absolute;right:-50px;top:-50px;width:190px;height:190px;border-radius:50%;border:26px solid rgba(255,255,255,.07);pointer-events:none}

/* Botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:14px;border:0;font-weight:650;cursor:pointer;text-decoration:none;text-align:center;line-height:1.2}
.btn:focus-visible,.chip:focus-visible,.iconbtn:focus-visible,.navbtn:focus-visible,.tap:focus-visible,.sw:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.btn-primary{background:var(--blue);color:var(--on-blue)}
.btn-soft{background:var(--blue-soft);color:var(--blue-ink)}
.btn-line{background:var(--surface);border:1px solid var(--line);color:var(--ink)}
.btn-danger{background:var(--red-soft);color:var(--red)}
.btn-text{background:none;color:var(--blue-ink);min-height:40px;padding:0 6px}
.btn-block{width:100%}
.btn-sm{min-height:36px;padding:0 12px;font-size:13.5px;border-radius:11px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btnrow .btn{flex:1 1 140px}

/* Pílulas e pontos */
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12.5px;font-weight:650;white-space:nowrap}
.pill.green{background:var(--green-soft);color:var(--green)}
.pill.yellow{background:var(--yellow-soft);color:var(--yellow)}
.pill.red{background:var(--red-soft);color:var(--red)}
.pill.blue{background:var(--blue-soft);color:var(--blue-ink)}
.pill.gray{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.dot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}
.dot.green{background:var(--green-dot)} .dot.yellow{background:var(--yellow-dot)} .dot.red{background:var(--red-dot)} .dot.gray{background:var(--faint)}

/* Linhas de lista */
.lrow{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);min-width:0}
.lrow:first-child{border-top:0;padding-top:2px}
.lrow:last-child{padding-bottom:2px}
.lrow .lbl{color:var(--muted);flex:1;min-width:0}
.lrow .val{font-weight:650;text-align:right}
.tap{cursor:pointer;background:none;border:0;width:100%;text-align:left;padding:0}
.ico-tile{width:38px;height:38px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;flex:none;color:var(--muted)}
.ico-tile.blue{background:var(--blue-soft);color:var(--blue-ink);border-color:transparent}

/* Manhã */
.morning{display:grid;grid-template-columns:auto 1fr auto;column-gap:12px;row-gap:0}
.mrow{display:contents}
.mrow > *{padding:10px 0;border-top:1px solid var(--line)}
.mrow:first-child > *{border-top:0}
.mt{font-family:var(--f-display);font-weight:650;font-size:17px;font-variant-numeric:tabular-nums;white-space:nowrap}
.mt.sm{font-size:14px;color:var(--muted);align-self:center}
.mt.key{font-size:24px;color:var(--blue-ink)}
.ml{color:var(--muted);align-self:center}
.mr{text-align:right;align-self:center}

/* Formulário */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field > label,.flabel{font-size:13.5px;font-weight:650;color:var(--ink)}
.hint{font-size:12.5px;color:var(--muted)}
.inp{width:100%;min-height:48px;border:1px solid var(--line);border-radius:13px;padding:0 13px;background:var(--surface);font-size:16px}
select.inp{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 21px,calc(100% - 13px) 21px;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
.inp:focus{outline:2px solid var(--blue);outline-offset:0;border-color:transparent}
.inp.bad{border-color:var(--red-dot)}
.err{color:var(--red);font-size:13px;font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:end}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:7px}
.chip.on{background:var(--blue);border-color:var(--blue);color:var(--on-blue)}
.chip.day{width:44px;padding:0;justify-content:center}
.seg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:13px;padding:3px;gap:3px}
.seg button{flex:1;min-height:36px;border:0;border-radius:10px;background:none;cursor:pointer;font-weight:650;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.sw{width:50px;height:30px;border-radius:999px;border:0;background:var(--line);position:relative;cursor:pointer;flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.sw.on{background:var(--green-dot)}
.sw.on::after{transform:translateX(20px)}
.check{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.check input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--blue);flex:none}
.sugg-wrap{position:relative}
.sugg{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:13px;background:var(--surface);overflow:hidden;margin-top:6px}
.sugg:empty{display:none}
.sugg button{border:0;background:none;text-align:left;padding:11px 13px;cursor:pointer;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center}
.sugg button:first-child{border-top:0}
.sugg button:hover{background:var(--surface-2)}
.sugg .tag{margin-left:auto;font-size:11px;color:var(--faint)}

/* Progresso */
.progress{display:flex;gap:6px}
.progress span{flex:1;height:5px;border-radius:99px;background:var(--line)}
.progress span.on{background:var(--blue)}

/* Navegação */
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,480px);background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:20}
.navbtn{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;cursor:pointer;color:var(--faint);font-size:11.5px;font-weight:650;border-radius:12px}
.navbtn.on{color:var(--blue-ink)}
.navbtn.on .ic{stroke-width:2.2}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(74px + env(safe-area-inset-bottom,0px));width:min(calc(100% - 32px),448px);z-index:19;box-shadow:0 8px 22px rgba(31,90,214,.28)}

/* Agenda */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.cal .dh{font-size:11.5px;color:var(--faint);font-weight:650;padding:4px 0;text-transform:uppercase}
.cal button{border:0;background:none;height:38px;border-radius:11px;cursor:pointer;font-weight:600;position:relative;font-variant-numeric:tabular-nums}
.cal button.out{color:var(--faint);opacity:.5}
.cal button.today{box-shadow:inset 0 0 0 1.5px var(--blue)}
.cal button.sel{background:var(--blue);color:var(--on-blue)}
.cal button i{position:absolute;bottom:4px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:var(--blue)}
.cal button.sel i{background:var(--on-blue)}
.ev{display:flex;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;cursor:pointer;text-align:left;width:100%}
.ev .when{font-family:var(--f-display);font-weight:650;font-variant-numeric:tabular-nums;min-width:52px}
.ev .when small{display:block;font-family:var(--f-body);font-weight:500;color:var(--faint);font-size:12px}
.ev.routine{border-left:4px solid var(--blue)}
.conn{display:flex;gap:10px;align-items:center;padding:8px 0 8px 22px;margin-left:16px;border-left:2px dashed var(--line);cursor:pointer;background:none;border-top:0;border-right:0;border-bottom:0;text-align:left;width:calc(100% - 16px)}
.conn.static{cursor:default}
.conn .box{flex:1;min-width:0;font-size:13.5px;color:var(--muted)}
.conn .box b{color:var(--ink);font-weight:650}
.conn.red .box{color:var(--red)} .conn.yellow .box{color:var(--yellow)}
.conn .warnbox{margin-top:4px;padding:8px 10px;border-radius:11px;font-weight:600;font-size:13px}
.conn.red .warnbox{background:var(--red-soft)} .conn.yellow .warnbox{background:var(--yellow-soft)}

/* Rotas */
.map{border-radius:18px;overflow:hidden;border:1px solid var(--line);position:relative;background:var(--surface-2)}
.map svg{display:block;width:100%;height:auto}
.map .mtag{position:absolute;left:10px;top:10px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:11.5px;font-weight:650;color:var(--muted)}
.route{border-radius:18px}
.route.sel{outline:2px solid var(--blue);outline-offset:-1px}
.rtitle{font-family:var(--f-display);font-size:19px;font-weight:650;letter-spacing:-.01em}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.kv div{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:8px 10px;min-width:0}
.kv small{display:block;color:var(--muted);font-size:11.5px;font-weight:600}
.kv b{font-family:var(--f-display);font-size:17px;font-variant-numeric:tabular-nums}
.steps{display:flex;flex-direction:column;margin-top:10px}
.step{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.step:first-child{border-top:0}
.step .m{margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.step.done{color:var(--faint);text-decoration:line-through}
.alert{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;padding:8px 10px;border-radius:11px;margin-top:8px}
.alert.red{background:var(--red-soft);color:var(--red)} .alert.yellow{background:var(--yellow-soft);color:var(--yellow)} .alert.green{background:var(--green-soft);color:var(--green)} .alert.gray{background:var(--surface-2);color:var(--muted)}

/* Benefícios */
.partner .logo{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:var(--blue-soft);color:var(--blue-ink);flex:none}
.code{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:20px;font-weight:700;letter-spacing:.08em;padding:14px;border:2px dashed var(--line);border-radius:14px;text-align:center;user-select:all;background:var(--surface-2)}

/* Modal */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:min(100%,480px);border-radius:24px 24px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));max-height:90vh;overflow:auto;display:flex;flex-direction:column;gap:14px}
.sheet .grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:-6px auto 0}
.cmp2{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;text-align:center;background:var(--surface-2);border:1px solid var(--line);border-radius:16px;padding:12px}
.cmp2 small{display:block;color:var(--muted);font-size:12px;font-weight:600}
.cmp2 b{font-family:var(--f-display);font-size:28px;font-variant-numeric:tabular-nums}
.cmp2 .old b{color:var(--faint);text-decoration:line-through;text-decoration-thickness:2px}
.ring{position:fixed;inset:0;z-index:60;background:var(--hero);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center}
.ring .big{font-family:var(--f-display);font-size:96px;font-weight:700;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.pulse{width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}*{transition:none!important}}

const toMin=s=>{if(!s)return 0;const[h,m]=String(s).split(':').map(Number);return h*60+m};
const fmt=m=>{if(m==null)return '--:--';m=((Math.round(m)%1440)+1440)%1440;return pad(Math.floor(m/60))+':'+pad(m%60)};

const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};

function locFromPlace(id){const p=st.places.find(p=>p.id===id);return p?{placeId:p.id,label:p.label,address:p.address,x:p.x,y:p.y}:null}
const placeById=id=>st.places.find(p=>p.id===id);

/* ---------- motor de deslocamento (simulado) ---------- */
const dist=(a,b)=>Math.hypot((a.x||0)-(b.x||0),(a.y||0)-(b.y||0));
function ratioFor(a,b){const R=st.routine;const o=placeById(R?.originId),d=placeById(R?.destId);const base=(o&&d)?dist(o,d):5;const r=dist(a,b)/(base||5);return isFinite(r)?r:1}
function duration(mode,sc,ratio){
  // TODO: trocar por consulta de duração prevista para o horário de saída (Google Maps / SPTrans / Metrô-CPTM).
  if(ratio<0.08) return 5;
  const base=BASE[sc][mode],o=MODES[mode].overhead; return Math.max(5,Math.round((o+(base-o)*ratio)/5)*5);
}
const dataScenario=()=>st.scenario==='unavailable'?st.lastGoodScenario:st.scenario;
function modeReason(sc,mode,dur,hab){
  if(dur<=hab) return 'Tudo normal hoje. Seu horário não mudou.';
  if(sc==='rain') return 'O trajeto está mais demorado por causa da chuva.';
  if(sc==='disruption') return mode==='bm'?'Há uma interrupção na Linha 1-Azul, e ônibus + metrô ficou mais demorado.':mode==='bus'?'Os ônibus estão mais cheios por causa da interrupção no metrô.':'Mais carros nas ruas por causa da interrupção no metrô.';
  return 'O trajeto está mais demorado hoje.';
}
function scaledSteps(mode,dur){const t=STEPS[mode];const tot=t.reduce((s,x)=>s+x[2],0);let acc=0;return t.map((x,i)=>{let m=i===t.length-1?dur-acc:Math.max(1,Math.round(x[2]*dur/tot));acc+=m;return[x[0],x[1],m]})}
function allowedModes(){const ms=st.routine?.modes||[];return MODE_ORDER.filter(k=>MODES[k].needs.some(n=>ms.includes(n)))}

/* ---------- compromissos ---------- */
function occursOn(ev,d){if(ev.repeat==='none'||!ev.repeat)return ev.date===d; if(d<ev.date)return false; const w=parseISO(d).getDay(); return ev.repeat==='weekdays'?(w>=1&&w<=5):(ev.days||[]).includes(w)}
const eventsOn=d=>st.events.filter(e=>occursOn(e,d)).sort((a,b)=>toMin(a.start)-toMin(b.start));
function travelBetween(a,b){const sc=dataScenario();const r=ratioFor(a,b);const m=st.selectedMode;return Math.min(duration(m,sc,r),duration('bus',sc,r))}

/* ---------- plano do dia ---------- */
function planFor(dateIso,o={}){
  const R=o.routine||st.routine; if(!R) return null;
  const evs=eventsOn(dateIso).filter(e=>e.considerAlarm&&!e.online);
  if(!evs.length) return {date:dateIso,none:true};
  const ev=evs[0]; const origin=placeById(R.originId)||st.places[0]; const dest=ev.location||origin;
  const ratio=ratioFor(origin,dest); const mode=o.mode||st.selectedMode;
  const stale=st.scenario==='unavailable'; const sc=dataScenario();
  const dur=duration(mode,sc,ratio), habDur=duration(mode,'normal',ratio);
  const margin=o.margin!=null?o.margin:ev.margin; const prep=R.prep; const evT=toMin(ev.start);
  const stop=o.stop!==undefined?o.stop:(st.stop&&st.stop.date===dateIso&&st.stop.leg==='commute'?st.stop:null);
  const extra=stop?stop.extra:0;
  const ideal=calculateRoutine({eventTime:evT,margin,travel:dur+(stop&&!stop.keep?extra:0),prep});
  const hab=calculateRoutine({eventTime:evT,margin,travel:habDur,prep});
  let alarm=ideal.wake,source='auto',note=null,conflict=false;
  const manual=R.manual&&R.manual.date===dateIso?R.manual.time:null;
  if(!R.alarmOn) source='off';
  else if(manual){alarm=toMin(manual);source='manual'}
  else if(!R.auto){alarm=hab.wake;source='fixed'}
  else{
    if(alarm>hab.wake&&!R.allowLater){alarm=hab.wake;note='Você não permite adiar o alarme, então mantivemos o horário habitual.'}
    if(alarm<hab.wake&&!R.allowEarlier){alarm=hab.wake;note='Você não permite antecipar o alarme, então mantivemos o horário habitual.'}
    if(alarm<toMin(R.earliest)){alarm=toMin(R.earliest);conflict=true}
  }
  const wake=source==='off'?ideal.wake:alarm;
  const depart=Math.max(ideal.departure,wake+prep);
  const arrival=depart+dur+extra; const slack=evT-arrival;
  const status=slack>=margin?'ok':slack>=0?'warn':'late';
  let reason=modeReason(sc,mode,dur,habDur); if(stop) reason+=` Inclui parada em ${stop.name} (+${extra} min).`;
  return {date:dateIso,ev,origin,dest,mode,ratio,sc,stale,dur,habDur,margin,prep,evT,ideal,hab,alarm:source==='off'?null:alarm,wake,depart,arrival,slack,status,source,note,conflict,diff:hab.wake-wake,reason,stop,extra};
}
function nextPlan(o){
  if(!st.routine) return null;
  for(let d=0;d<14;d++){const di=iso(addDays(new Date(),d));const p=planFor(di,o);if(!p||p.none)continue;
    if(d===0&&(nowMin()>=p.wake||nowMin()>=p.evT))continue; return p}
  return null;
}
function refresh(reason){
  const p=nextPlan();
  if(p&&!reason&&p.dur<=p.habDur&&!p.stop) reason='As condições do trajeto voltaram ao normal.';
  if(p&&p.alarm!=null){const t=fmt(p.alarm);
    if(st.lastAlarm&&st.lastAlarm.date===p.date&&st.lastAlarm.time!==t){const diff=toMin(st.lastAlarm.time)-p.alarm;
      st.changes.unshift({date:p.date,from:st.lastAlarm.time,to:t,reason:reason||p.reason,at:nowHM()}); st.changes=st.changes.slice(0,20);
      if(st.prefs.notif.alarm) pushNotif(diff>0?`Seu alarme foi antecipado em ${diff} minutos.`:`Seu alarme foi adiado em ${-diff} minutos.`,`Novo horário: ${t} (antes ${st.lastAlarm.time}). ${reason||p.reason}`,{type:'alarm'});}
    st.lastAlarm={date:p.date,time:t};}
  if(p){const L=st.lastDur;const same=L&&L.date===p.date&&L.eventId===p.ev.id&&L.mode===p.mode;
    if(same&&st.prefs.notif.travel){const delta=p.dur-L.dur;
      if(p.stale&&!L.stale) pushNotif('Não conseguimos atualizar o tempo do trajeto.',`Mantivemos a última previsão (${L.dur} min). Confira antes de sair.`,{type:'route'});
      else if(!p.stale&&Math.abs(delta)>=(st.prefs.travelMin||5)) pushNotif(delta>0?`Seu trajeto ficou ${delta} min mais longo.`:`Seu trajeto ficou ${-delta} min mais curto.`,`${MODES[p.mode].label} até ${p.ev.location?.label||p.ev.name}: agora ${p.dur} min (antes ${L.dur} min). ${reason||p.reason}`,{type:'route'});}
    st.lastDur={date:p.date,eventId:p.ev.id,mode:p.mode,dur:p.dur,stale:p.stale};}
  if(st.trip&&st.prefs.notif.travel){const T=st.trip;const d=duration(T.mode,dataScenario(),T.ratio);
    if(T.lastDur!=null&&Math.abs(d-T.lastDur)>=(st.prefs.travelMin||5)&&st.scenario!=='unavailable'){const arr=T.depart+d+(T.extra||0);pushNotif(d>T.lastDur?`Trajeto em andamento: +${d-T.lastDur} min.`:`Trajeto em andamento: ${T.lastDur-d} min mais rápido.`,`Nova previsão de chegada: ${fmt(arr)} para ${T.destLabel} (compromisso às ${T.start}).`,{type:'trip'})}
    T.lastDur=d;}
  if(st.scenario!=='unavailable'){st.lastGoodScenario=st.scenario;st.lastGoodAt=st.updatedAt}
  save();
}
function pushNotif(title,body,target){st.notifs.unshift({id:uid('n'),at:'Agora, '+nowHM(),title,body,target,read:false});st.notifs=st.notifs.slice(0,30)}

function recommendRoute(sc,ratio){
  const al=allowedModes(); const pool=al.length?al:MODE_ORDER;
  let best=null; for(const m of pool){const d=duration(m,sc,ratio);
    const k=[d,st.routine.pref==='transfers'?MODES[m].transfers:(MODES[m].walk??d)];
    if(!best||k[0]<best.k[0]||(k[0]===best.k[0]&&k[1]<best.k[1]))best={m,k}}
  return best?.m;
}

/* ===== TELA 5 — Agenda ===== */
function vAgenda(){
  const sel=ui.agendaDate||(ui.plan?ui.plan.date:todayISO()); ui.agendaDate=sel;
  const sd=parseISO(sel); const cm=ui.calMonth||{y:sd.getFullYear(),m:sd.getMonth()};
  const first=new Date(cm.y,cm.m,1); const startG=mondayOf(first);
  let cells=''; for(let i=0;i<42;i++){const d=addDays(startG,i);if(i>=35&&d.getMonth()!==cm.m)break;const di=iso(d);const has=eventsOn(di).length;
    cells+=`<button class="${d.getMonth()!==cm.m?'out':''} ${di===todayISO()?'today':''} ${di===sel?'sel':''}" data-action="pick-day" data-d="${di}" aria-label="${dayLabel(di)}${has?`, ${has} compromissos`:''}">${d.getDate()}${has?'<i></i>':''}</button>`}
  let main='';
  if(ui.agendaMode==='day'){main=`<div class="section-title"><h2>${dayLabel(sel)}</h2></div>${dayList(sel)}`}
  else{const mon=mondayOf(sd);main=`<div class="section-title"><h2>Semana de ${mon.getDate()}/${pad(mon.getMonth()+1)}</h2></div><div class="stack-sm">`+[0,1,2,3,4,5,6].map(i=>{const di=iso(addDays(mon,i));const evs=eventsOn(di);const c=dayConflicts(di);
      return `<button class="ev" data-action="pick-day-week" data-d="${di}"><span class="when" style="min-width:64px">${DOW[parseISO(di).getDay()]}<small>${parseISO(di).getDate()}/${pad(parseISO(di).getMonth()+1)}</small></span><span class="grow">${evs.length?`<b style="display:block">${evs.length} compromisso${evs.length>1?'s':''}</b><span class="small muted">${evs.map(e=>e.start+' '+esc(e.name)).slice(0,2).join(' · ')}${evs.length>2?' …':''}</span>`:'<span class="small muted">Livre</span>'}
        ${c?`<span class="row" style="margin-top:6px"><span class="pill ${c.red?'red':'yellow'}">${icon('alert',13)}${c.red?'Conflito de horário':'Pouca folga'}</span></span>`:''}</span>${icon('chev',16)}</button>`}).join('')+'</div>'}
  return `<header class="hd"><div><p class="eyebrow">Agenda</p><h1>Minha agenda</h1></div><div class="hd-actions">${bell()}</div></header>
  <button class="btn btn-primary btn-block" style="margin:10px 0 12px" data-action="new-event" data-d="${sel}">${icon('plus',18)}Adicionar compromisso</button>
  <section class="card"><div class="row between" style="margin-bottom:8px"><button class="iconbtn" data-action="cal-nav" data-n="-1" aria-label="Mês anterior">${icon('back',18)}</button><b>${cap(MONTHS[cm.m])} ${cm.y}</b><button class="iconbtn" data-action="cal-nav" data-n="1" aria-label="Próximo mês">${icon('chev',18)}</button></div>
    <div class="cal">${['S','T','Q','Q','S','S','D'].map(x=>`<span class="dh">${x}</span>`).join('')}${cells}</div>
    <div class="seg" style="margin-top:12px"><button class="${ui.agendaMode==='day'?'on':''}" data-action="agenda-mode" data-v="day">Dia</button><button class="${ui.agendaMode==='week'?'on':''}" data-action="agenda-mode" data-v="week">Semana</button></div></section>
  <div class="stack" style="margin-top:6px">${main}</div>`;
}
function dayConflicts(d){const evs=eventsOn(d);let red=false,yellow=false,lastIn=null,prev=null;
  evs.forEach(ev=>{if(prev){if(toMin(ev.start)<toMin(prev.end))red=true;else if(!ev.online&&lastIn){const tr=travelBetween(lastIn.location,ev.location);const av=toMin(ev.start)-toMin(prev.end);if(av<tr)red=true;else if(av<tr+(ev.margin||0))yellow=true}}if(!ev.online)lastIn=ev;prev=ev});
  return red||yellow?{red}:null}


/* hora de sair para um compromisso: início − margem − trajeto (a partir do compromisso presencial anterior ou de casa) */
function eventDeparture(ev,date){
  if(ev.online||!ev.location) return null;
  const plan=planFor(date); if(plan&&!plan.none&&plan.ev.id===ev.id) return {depart:plan.depart,travel:plan.dur,from:plan.origin.label||'Casa'};
  const before=eventsOn(date).filter(e=>!e.online&&e.location&&e.id!==ev.id&&toMin(e.start)<toMin(ev.start));
  const prev=before[before.length-1]; const origin=prev?prev.location:(placeById(st.routine?.originId)||st.places[0]); if(!origin) return null;
  const travel=travelBetween(origin,ev.location); return {depart:toMin(ev.start)-(ev.margin||0)-travel,travel,from:prev?prev.name:(origin.label||'Casa'),prevEnd:prev?toMin(prev.end):null};
}
function reminderInfo(ev,date){
  if(!ev.reminder) return null;
  if(ev.online) return {at:toMin(ev.start)-ev.reminder,text:`${ev.reminder} min antes do início (online, sem deslocamento)`};
  const d=eventDeparture(ev,date); if(!d) return null;
  return {at:d.depart-ev.reminder,depart:d.depart,text:`${ev.reminder} min antes de sair`};
}

/* ===== TELA 6 — Compromisso ===== */

    :{id:null,name:'',date:date||ui.agendaDate||todayISO(),start:'',end:'',online:false,location:null,locMode:'p:facul',addr:'',repeat:'none',days:[],reminder:15,margin:st.routine?.margin??10,considerAlarm:false};
  if(!ev&&!placeById('facul'))ui.eventDraft.locMode=st.places[0]?'p:'+st.places[0].id:'addr';
  ui.errors={}; go('event',{id});
}

function remHint(D){
  if(!D.reminder) return '';

  if(!D.start||!D.date) return '<p class="hint">O lembrete conta a partir da hora de sair, que considera o trajeto e a margem.</p>';
  const loc=D.locMode==='addr'?(D.addr.trim()?{address:D.addr,...geocode(D.addr)}:null):locFromPlace(D.locMode.slice(2)); if(!loc) return '';
  const tmp={id:D.id||'__draft',start:D.start,margin:D.margin,online:false,location:loc,reminder:D.reminder};
  const dep=eventDeparture(tmp,D.date); if(!dep) return '';
  return `<p class="hint">Saída prevista às <b>${fmt(dep.depart)}</b> (${dep.travel} min saindo de ${esc(dep.from)}). Lembrete às <b>${fmt(dep.depart-D.reminder)}</b>.</p>`+(dep.prevEnd!=null&&dep.depart<dep.prevEnd?`<p class="err">A saída ideal (${fmt(dep.depart)}) é antes do fim de “${esc(dep.from)}” (${fmt(dep.prevEnd)}). Há risco de atraso.</p>`:'');
}
function saveEvent(){
  const D=ui.eventDraft,E={};

  if(!D.start)E.start='Informe o início.';
  if(!D.end)E.end='Informe o término.';
  if(D.start&&D.end&&toMin(D.end)<=toMin(D.start))E.end='O término precisa ser depois do início.';
  if(D.locMode==='addr'&&!D.addr.trim())E.loc='Informe o endereço ou escolha “Online”.';
  if(D.repeat==='custom'&&!D.days.length)E.days='Escolha os dias da repetição.';
  ui.errors=E; if(Object.keys(E).length){render();toast('Revise os campos destacados.');return}
  const online=D.locMode==='online';
  const location=online?null:D.locMode==='addr'?{label:D.addr.split(' — ')[0].split(',')[0],address:D.addr.trim(),...geocode(D.addr)}:locFromPlace(D.locMode.slice(2));
  const before=st.lastAlarm?.time;
  const data={name:D.name.trim(),date:D.date,start:D.start,end:D.end,online,location,repeat:D.repeat,days:D.repeat==='custom'?[...D.days]:[],reminder:D.reminder,margin:D.margin,considerAlarm:!online&&D.considerAlarm};
  if(D.id){const ev=st.events.find(e=>e.id===D.id);Object.assign(ev,data);if(ev.isRoutine&&st.routine){st.routine.arrive=ev.start;st.routine.margin=ev.margin;if(ev.repeat==='custom')st.routine.days=[...ev.days]}}
  else st.events.push({id:uid('ev'),...data});

}

/* ===== TELA 7 — Rotas ===== */
function defaultRQ(){const p=ui.plan;const o=placeById(st.routine?.originId)||st.places[0];
  if(p)return{from:{...o,placeId:o.id},to:p.ev.location,arrive:p.ev.start,margin:p.ev.margin,mode:'all',date:p.date,eventId:p.ev.id};
  const d=placeById(st.routine?.destId)||st.places[1]||o;return{from:{...o,placeId:o.id},to:{...d,placeId:d.id},arrive:st.routine?.arrive||'08:00',margin:st.routine?.margin||10,mode:'all',date:todayISO()}}
function vRoutes(){
  if(!st.places.length) return `<header class="hd"><div><p class="eyebrow">Rotas</p><h1>Rotas do dia</h1></div></header>`+emptyBox('route','Sem locais salvos','Configure sua rotina para comparar trajetos.',`<button class="btn btn-primary" data-action="start-setup">Configurar</button>`);
  const q=ui.rq||(ui.rq=defaultRQ()); const sc=dataScenario(); const stale=st.scenario==='unavailable';
  const ratio=ratioFor(q.from,q.to); const arrive=toMin(q.arrive||'08:00'); const margin=q.margin??10;
  const isPlan=ui.plan&&q.eventId===ui.plan.ev.id&&q.date===ui.plan.date&&q.from.placeId===st.routine.originId;
  const curDep=isPlan?ui.plan.depart:arrive-margin-duration(st.selectedMode,sc,ratio);
  const rec=recommendRoute(sc,ratio); const al=allowedModes();
  const filt={all:MODE_ORDER,public:['bm','bus'],car:['car'],app:['app'],walk:['walk']}[q.mode];
  const placeOpts=(cur)=>st.places.map(p=>`<option value="p:${p.id}" ${cur.placeId===p.id?'selected':''}>${esc(p.label)} · ${esc(p.address.split(' — ')[0])}</option>`).join('')+(!cur.placeId?`<option value="cur" selected>${esc(cur.label||cur.address)}</option>`:'');
  const cards=filt.map(m=>{
    const d=duration(m,sc,ratio); const arr=curDep+d; const slack=arrive-arr; const s=slack>=margin?'ok':slack>=0?'warn':'late';
    const recDep=arrive-margin-d; const wake=recDep-(st.routine?.prep||45);
    const steps=scaledSteps(m,d); const alerts=(ALERTS[sc]||{})[m]||[];
    const walkMin=MODES[m].walk==null?d:steps.filter(x=>x[0]==='walk').reduce((a,x)=>a+x[2],0);
    const allowed=al.includes(m);
    const recd=duration(rec,sc,ratio);
    const why=m===rec?`Mais rápida entre os meios que você usa${st.routine.pref==='transfers'?', com menos baldeações':''}.`:!allowed?(d<recd?'Mais rápida, mas fora dos meios que você escolheu.':'Fora dos meios que você escolheu.'):d===recd?(st.routine.pref==='transfers'?'Mesmo tempo, porém com mais baldeações.':'Mesmo tempo, porém com mais caminhada.'):`${d-recd} min mais longa que a recomendada.`;
    const sel=st.selectedMode===m; const open=ui.expanded[m];
    const gm=`https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(q.from.address+', São Paulo')}&destination=${encodeURIComponent(q.to.address+', São Paulo')}&travelmode=${MODES[m].gmaps}`;
    return `<section class="card route ${sel?'sel':''}">
      <div class="row between top"><div class="row" style="gap:6px;color:var(--blue-ink)">${modeIcons(m,20)}</div><div class="row" style="gap:6px">${m===rec?'<span class="pill green">Recomendada</span>':''}${sel?'<span class="pill blue">Em uso</span>':''}</div></div>
      <p class="rtitle" style="margin-top:8px">${MODES[m].label} — ${d} min — chegada ${fmt(arr)}</p>
      <div class="row wrap" style="gap:8px;margin-top:6px">${statusPill(s)}<span class="small muted">saindo às ${fmt(curDep)}${stale?' · última previsão':''}</span></div>
      <div class="kv"><div><small>Saída recomendada</small><b>${fmt(recDep)}</b></div><div><small>Chegada prevista</small><b>${fmt(arrive-margin)}</b></div><div><small>Alarme</small><b>${fmt(wake)}</b></div></div>
      <p class="small muted" style="margin-top:10px">${walkMin} min de caminhada · ${MODES[m].transfers?MODES[m].transfers+' baldeações':'sem baldeação'}</p>
      ${alerts.map(a=>`<div class="alert ${a[0]}">${icon('alert',16)}<span>${a[1]}</span></div>`).join('')}
      <p class="small" style="margin-top:8px"><b>Motivo:</b> ${why}</p>
      ${open?`<div class="steps">${steps.map(x=>`<div class="step">${icon(x[0],18)}<span>${x[1]}</span><span class="m">${x[2]} min</span></div>`).join('')}</div>`:''}
      <div class="btnrow" style="margin-top:12px">${sel?'':`<button class="btn btn-sm btn-primary" data-action="use-route" data-m="${m}">Usar esta rota</button>`}<button class="btn btn-sm btn-line" data-action="toggle-steps" data-m="${m}" aria-expanded="${!!open}">${open?'Ocultar etapas':'Ver etapas'}</button></div>
      <a class="btn btn-sm btn-text" style="margin-top:4px" href="${gm}" target="_blank" rel="noopener">${icon('ext',16)}Abrir no Google Maps</a>
    </section>`}).join('');
  return `<header class="hd"><div><p class="eyebrow">${dayLabel(q.date)}</p><h1>Rotas do dia</h1></div><div class="hd-actions">${bell()}</div></header>
  <div style="margin:2px 0 12px">${scenChip()}</div>
  ${stale?`<div class="card tone-yellow stack-sm" style="margin-bottom:12px"><p class="ttl" style="font-weight:700">Previsão não atualizada</p><p class="small">As durações abaixo são da última previsão válida (${st.lastGoodAt}) e podem estar desatualizadas.</p></div>`:''}
  <section class="card stack">
    <div class="grid2"><div class="field"><label for="r-from">Origem</label><select class="inp" id="r-from" data-change="rq-place" data-k="from">${placeOpts(q.from)}</select></div>
    <div class="field"><label for="r-to">Destino</label><select class="inp" id="r-to" data-change="rq-place" data-k="to">${placeOpts(q.to)}</select></div></div>
    <div class="grid2"><div class="field"><label for="r-arr">Chegar até</label><input class="inp" id="r-arr" type="time" value="${q.arrive}" data-bind="rq.arrive"></div>
    <div class="field"><label for="r-mode">Meio de transporte</label><select class="inp" id="r-mode" data-bind="rq.mode">${opts(['all','public','car','app','walk'],q.mode,v=>({all:'Todos',public:'Transporte público',car:'Carro',app:'Transporte por app',walk:'Caminhada'})[v])}</select></div></div>
    ${dist(q.from,q.to)<0.05?'<p class="err">Origem e destino são o mesmo local.</p>':''}
  </section>
  <div class="map" style="margin-top:12px">${mapSvg(q)}<span class="mtag">Mapa ilustrativo · demonstração</span></div>
  <p class="xs faint" style="margin:6px 2px 0">Este mapa não é navegação GPS. Use “Abrir no Google Maps” para navegar.</p>
  <div class="stack" style="margin-top:12px">${cards}</div>`;
}
function mapSvg(q){
  const W=340,H=180; const m=st.selectedMode; const col=m==='car'||m==='app'?'var(--ink)':m==='walk'?'var(--green-dot)':'var(--blue)';
  const dis=st.scenario==='disruption'&&(m==='bm');
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Mapa ilustrativo de ${esc(q.from.label||'origem')} até ${esc(q.to.label||'destino')}">
  <rect width="${W}" height="${H}" fill="var(--surface-2)"/>
  <path d="M220 0 C 210 50, 250 90, 230 180" stroke="var(--line)" stroke-width="14" fill="none"/>
  <ellipse cx="96" cy="44" rx="40" ry="22" fill="var(--green-soft)"/>
  <g stroke="var(--line)" stroke-width="3">${[30,75,120,160].map(y=>`<line x1="0" x2="${W}" y1="${y}" y2="${y+8}"/>`).join('')}${[50,130,200,280].map(x=>`<line y1="0" y2="${H}" x1="${x}" x2="${x-10}"/>`).join('')}</g>
  <path d="M48 140 L 92 136 L 128 102 L 196 96 L 236 60 L 290 44" fill="none" stroke="${col}" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" ${m==='walk'?'stroke-dasharray="2 8"':''}/>
  ${dis?`<g transform="translate(150 88)"><circle r="11" fill="var(--red-dot)"/><path d="M0-5v5M0 4v.5" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></g>`:''}
  <circle cx="48" cy="140" r="9" fill="var(--surface)" stroke="var(--blue)" stroke-width="4"/>
  <g transform="translate(290 44)"><circle r="12" fill="var(--blue)"/><circle r="4.5" fill="#fff"/></g>
  <g font-family="Figtree, sans-serif" font-size="12" font-weight="700" fill="var(--ink)"><text x="32" y="166">${esc((q.from.label||'Origem').slice(0,22))}</text><text x="${W-12}" y="72" text-anchor="end">${esc((q.to.label||'Destino').slice(0,22))}</text></g>
  </svg>`;
}

/* ===== TELA 8 — Trajeto em andamento ===== */
function vTrip(){
  const T=st.trip;
  if(!T) return subhd('Trajeto')+emptyBox('route','Nenhum trajeto em andamento','Inicie pelo botão “Iniciar trajeto” na tela Hoje.',`<button class="btn btn-primary" data-action="start-trip">Iniciar trajeto</button>`);
  const ev=st.events.find(e=>e.id===T.eventId); const sc=dataScenario();
  const dur=duration(T.mode,sc,T.ratio)+(T.extra||0); const arr=T.depart+dur; const evT=toMin(T.start); const slack=evT-arr; const s=slack>=T.margin?'ok':slack>=0?'warn':'late';
  const steps=scaledSteps(T.mode,duration(T.mode,sc,T.ratio)); const alerts=(ALERTS[sc]||{})[T.mode]||[];
  return subhd('Trajeto em andamento')+`<div class="stack">
  <section class="card"><p class="eyebrow">Destino</p><h2 style="margin-top:4px">${esc(T.destLabel)}</h2><p class="small muted">${esc(T.destAddr)}</p>
    <div class="kv"><div><small>Compromisso</small><b>${T.start}</b></div><div><small>Previsão</small><b>${fmt(arr)}</b></div><div><small>Margem</small><b>${slack} min</b></div></div>
    <div class="row between" style="margin-top:12px">${statusPill(s)}<span class="small muted">${modeIcons(T.mode,16)}</span></div>
    <p class="xs faint" style="margin-top:8px">Simulação: saída considerada às ${fmt(T.depart)}. ${st.scenario==='unavailable'?'Previsão não atualizada.':'Troque o cenário para ver o status mudar.'}</p></section>
  ${alerts.length?`<section class="card"><h2>Alertas da rota</h2>${alerts.map(a=>`<div class="alert ${a[0]}">${icon('alert',16)}<span>${a[1]}</span></div>`).join('')}</section>`:''}
  <section class="card"><div class="card-hd"><h2>Etapas</h2><span class="small muted">${T.done.length}/${steps.length}</span></div>
    <div class="steps">${steps.map((x,i)=>`<label class="step ${T.done.includes(i)?'done':''}" style="cursor:pointer"><input type="checkbox" ${T.done.includes(i)?'checked':''} data-change="trip-step" data-i="${i}" style="width:18px;height:18px;accent-color:var(--blue)">${icon(x[0],18)}<span>${x[1]}</span><span class="m">${x[2]} min</span></label>`).join('')}</div></section>
  <div class="btnrow"><button class="btn btn-line" data-action="trip-alts">Ver alternativas</button><button class="btn btn-primary" data-action="finish-trip">${icon('flag',18)}Finalizar trajeto</button></div>
  </div>`;
}
function startTrip(){
  if(st.trip){go('trip');return}
  const p=ui.plan; if(!p){toast('Nenhum compromisso presencial para iniciar trajeto.');return}
  st.trip={eventId:p.ev.id,date:p.date,mode:p.mode,ratio:p.ratio,depart:p.depart,start:p.ev.start,margin:p.margin,destLabel:p.ev.location?.label||p.ev.name,destAddr:p.ev.location?.address||'',extra:p.extra,done:[],planned:fmt(p.arrival),lastDur:p.dur};
  save(); go('trip');
}

/* ===== TELA 9 — Benefícios ===== */
function vBenefits(){
  const head=`<header class="hd"><div><p class="eyebrow">Benefícios</p><h1>Benefícios no caminho</h1><p class="muted" style="margin-top:4px">Paradas que cabem na sua rotina</p></div><div class="hd-actions">${bell()}</div></header>`;
  if(!st.prefs.partners) return head+emptyBox('tag','Sugestões de parceiros desativadas','Você desativou as sugestões em Privacidade. Seus trajetos continuam iguais.',`<button class="btn btn-soft" data-action="partners-on">Ativar sugestões</button>`);
  const F=ui.bf; const list=PARTNERS.filter(p=>(F.cat==='all'||p.cat===F.cat)&&(!F.near||p.dist<=500));

  ${st.stop?`<div class="alert blue" style="background:var(--blue-soft);color:var(--blue-ink);margin-bottom:12px">${icon('pin',16)}<span>Parada incluída: <b>${esc(st.stop.name)}</b> (+${st.stop.extra} min). <a href="#" data-action="remove-stop">Remover</a></span></div>`:''}
  <div class="stack">${list.length?list.map(p=>`<button class="card partner tap" style="padding:14px" data-action="go" data-v="benefit" data-id="${p.id}"><div class="row top"><span class="logo">${icon(p.cat==='cafe'?'coffee':p.cat==='almoco'?'food':'box',22)}</span><span class="grow"><span class="row between"><b>${esc(p.name)}</b><span class="pill gray">Parceiro</span></span>
    <span class="small muted" style="display:block">${p.catLabel} · ${p.dist<1000?p.dist+' m':(p.dist/1000).toFixed(1).replace('.',',')+' km'} do trajeto · +${p.extra} min</span>
    <span style="display:block;margin-top:6px;font-weight:650;color:var(--blue-ink)">${esc(p.offer)}</span><span class="btn btn-sm btn-soft" style="margin-top:10px">Ver benefício</span></span></div></button>`).join('')
    :emptyBox('tag','Nenhum parceiro com esses filtros','Tente outra categoria ou desative “Próximos da rota”.',`<button class="btn btn-line btn-sm" data-action="bf-reset">Limpar filtros</button>`)}</div>
  <p class="xs faint" style="margin-top:14px">Ofertas de demonstração. Parceiros nunca alteram sua rota sem sua confirmação e não recebem seus trajetos individuais.</p>`;

function vBenefit(){
  const p=PARTNERS.find(x=>x.id===ui.params.id); if(!p) return subhd('Benefício')+emptyBox('tag','Benefício não encontrado','');

  <section class="card stack"><div class="row top"><span class="logo" style="width:54px;height:54px;border-radius:16px;display:flex;align-items:center;justify-content:center;background:var(--blue-soft);color:var(--blue-ink)">${icon(p.cat==='cafe'?'coffee':p.cat==='almoco'?'food':'box',26)}</span><div class="grow"><h2>${esc(p.name)}</h2><p class="small muted">${p.catLabel} · <span class="pill gray">Parceiro</span></p></div></div>
    <p style="font-size:18px;font-weight:700;color:var(--blue-ink)">${esc(p.offer)}</p>
    <div class="lrow"><span class="ico-tile">${icon('pin',18)}</span><span class="lbl">Endereço</span><span class="val small">${esc(p.address)}</span></div>
    <div class="lrow"><span class="ico-tile">${icon('route',18)}</span><span class="lbl">Distância do trajeto</span><span class="val small">${p.dist<1000?p.dist+' m':(p.dist/1000).toFixed(1).replace('.',',')+' km'}</span></div>
    <div class="lrow"><span class="ico-tile">${icon('clock',18)}</span><span class="lbl">Tempo adicional</span><span class="val small">+${p.extra} min</span></div>
    <div class="lrow"><span class="ico-tile">${icon('cal',18)}</span><span class="lbl">${p.leg==='lunch'?'Melhor momento':'Encaixe'}</span><span class="val small">${p.leg==='lunch'?'Intervalo de almoço':'No caminho da manhã'}</span></div></section>
  <section class="card stack"><h2>Cupom</h2><p class="small muted">${esc(p.terms)} ${esc(p.valid)}.</p><div class="code" id="coupon">${p.code}</div>
    <button class="btn btn-line btn-block" data-action="copy" data-code="${p.code}">${icon('copy',18)}Copiar cupom</button></section>
  ${added?`<button class="btn btn-danger btn-block" data-action="remove-stop">Remover parada</button>`:`<button class="btn btn-primary btn-block" data-action="ask-stop" data-id="${p.id}">${icon('plus',18)}Adicionar parada</button>`}
  <p class="xs faint">Antes de incluir, mostramos como a parada afeta sua chegada. A rota nunca muda sem sua confirmação.</p></div>`;

function lunchLeg(d){const evs=eventsOn(d);let prev=null,lastIn=null;for(const ev of evs){if(prev&&!ev.online&&lastIn&&toMin(prev.end)>=toMin('11:00')&&toMin(prev.end)<=toMin('14:00'))return{from:lastIn,to:ev,prev};if(!ev.online)lastIn=ev;prev=ev}return null}

  ${R?sec('Rotinas recorrentes','history',`<div class="lrow"><span class="grow"><b style="display:block">${esc(st.events.find(e=>e.isRoutine)?.name||'Rotina')}</b><span class="small muted">${R.days.slice().sort((a,b)=>((a+6)%7)-((b+6)%7)).map(d=>DOW[d]).join(', ')} · chegar ${R.arrive} · ${R.prep} min para se arrumar · margem ${R.margin} min</span></span></div><button class="btn btn-line btn-sm" style="margin-top:8px" data-action="edit-routine">Editar rotina</button>`):''}

    <div class="seg" style="margin-top:10px"><button class="${R.pref==='walk'?'on':''}" data-action="set-pref" data-v="walk">Menos caminhada</button><button class="${R.pref==='transfers'?'on':''}" data-action="set-pref" data-v="transfers">Menos baldeações</button></div>`):''}

    <details class="faq"><summary>E se os dados não atualizarem?</summary><p>Mantemos o último horário válido, avisamos que a previsão não foi atualizada e você pode ajustar manualmente.</p></details>`)}
  ${sec('Demonstração','play',`<p class="small muted">Troque o cenário para ver alarme, cards e rotas mudarem.</p><div class="btnrow" style="margin-top:10px"><button class="btn btn-sm btn-soft" data-action="open-scen">Trocar cenário</button><button class="btn btn-sm btn-line" data-action="demo">Restaurar demonstração</button></div><button class="btn btn-primary btn-block" style="margin-top:10px" data-action="start-setup">Configurar minha própria rotina</button><p class="xs faint" style="margin-top:6px">Ao salvar, os dados da demonstração são substituídos pela sua rotina.</p>`)}

function stopModal(M){
  const p=PARTNERS.find(x=>x.id===M.id); const d=ui.plan?.date;
  if(p.leg==='lunch'){const L=d&&lunchLeg(d);
    if(!L) return `<h2>Sem intervalo de almoço com deslocamento</h2><p class="small muted">No dia planejado não há um deslocamento entre compromissos no horário de almoço. A parada não foi adicionada.</p><button class="btn btn-line btn-block" data-action="close">Fechar</button>`;
    const tr=travelBetween(L.from.location,L.to.location);const avail=toMin(L.to.start)-toMin(L.prev.end);const left=avail-tr-p.extra;
    const tone=left<0?'red':left<L.to.margin?'yellow':'green';
    return `<h2>Incluir ${esc(p.name)}?</h2><p class="small muted">No deslocamento até <b>${esc(L.to.name)}</b> (${L.to.start}).</p><div class="cmp2"><div><small>Folga hoje</small><b>${avail-tr} min</b></div>${icon('chev',20)}<div><small>Com a parada</small><b>${left} min</b></div></div>
    <div class="alert ${tone}">${icon(tone==='green'?'check':'alert',16)}<span>${left<0?`Você chegaria ${-left} min atrasado em ${esc(L.to.name)}.`:left<L.to.margin?`A parada reduz sua folga para ${left} min, abaixo da margem de ${L.to.margin} min.`:`Cabe na sua rotina: sobram ${left} min.`}</span></div>
    <div class="stack-sm"><button class="btn btn-primary btn-block" data-action="confirm-stop" data-id="${p.id}" data-leg="${L.to.id}">Incluir parada</button><button class="btn btn-line btn-block" data-action="close">Cancelar</button></div>`;}
  const base=ui.plan; if(!base) return `<h2>Sem trajeto planejado</h2><button class="btn btn-line btn-block" data-action="close">Fechar</button>`;
  const stopObj=(keep)=>({partnerId:p.id,name:p.name,extra:p.extra,keep,date:base.date,leg:'commute'});
  const k=planFor(base.date,{stop:stopObj(true)}), a=planFor(base.date,{stop:stopObj(false)});

  return `<h2>Incluir ${esc(p.name)}?</h2><p class="small muted">Parada no caminho para ${esc(base.ev.name)} · +${p.extra} min</p>
  <div class="cmp2"><div class="old"><small>Chegada atual</small><b>${fmt(base.arrival)}</b><small>margem ${base.slack} min</small></div>${icon('chev',20)}<div><small>Com a parada</small><b>${fmt(k.arrival)}</b><small>margem ${k.slack} min</small></div></div>
  <div class="alert ${tone}">${icon(tone==='green'?'check':'alert',16)}<span>${k.slack<0?`Saindo às ${fmt(base.depart)}, você chegaria ${-k.slack} min atrasado.`:k.slack<k.margin?`Saindo às ${fmt(base.depart)}, sua margem cai de ${base.slack} para ${k.slack} min.`:'Cabe na sua margem.'}</span></div>
  <div class="stack-sm"><button class="btn btn-primary btn-block" data-action="confirm-stop" data-id="${p.id}" data-keep="0">Incluir e sair às ${fmt(a.depart)}${a.alarm!=null?` (alarme ${fmt(a.alarm)})`:''}</button>
  <button class="btn btn-line btn-block" data-action="confirm-stop" data-id="${p.id}" data-keep="1">Incluir e manter saída às ${fmt(base.depart)}</button>
  <button class="btn btn-text btn-block" data-action="close">Cancelar</button></div>${a.conflict?`<p class="xs" style="color:var(--red)">Seu limite para acordar (${st.routine.earliest}) impede antecipar o alarme o suficiente.</p>`:''}`;
}

    refresh('Você alterou as configurações do alarme.');const n=nextPlan();const now=n&&n.alarm!=null?fmt(n.alarm):null;ui.plan=n;ui.alarmDraft=makeAlarmDraft();
    toast(now&&before&&now!==before?`Alterações salvas. Alarme ${before} → ${now}`:'Alterações salvas.')},
  'set-manual':()=>{const p=ui.plan;if(!ui.alarmDraft.manualTime){toast('Escolha um horário.');return}st.routine.manual={date:p.date,time:ui.alarmDraft.manualTime};commit('Você definiu um horário manual.',`Horário manual: ${ui.alarmDraft.manualTime}`)},
  'clear-manual':()=>{st.routine.manual=null;commit('Você voltou ao ajuste automático.','Ajuste automático retomado.')},
  ring:()=>{ui.modal={type:'ring'};render()},
  'new-event':d=>openEvent(null,d.d),
  'edit-event':d=>openEvent(d.id),
  'save-event':()=>saveEvent(),
  'ask-delete':d=>{const ev=st.events.find(e=>e.id===d.id);ui.modal={type:'delete',id:d.id,routine:ev?.isRoutine,repeat:ev?.repeat!=='none'};render()},
  'confirm-delete':d=>{const before=st.lastAlarm?.time;st.events=st.events.filter(e=>e.id!==d.id);if(st.trip?.eventId===d.id)st.trip=null;ui.modal=null;ui.eventDraft=null;refresh('Um compromisso foi excluído.');back();const p=nextPlan();const now=p&&p.alarm!=null?fmt(p.alarm):null;toast(now&&before&&now!==before?`Compromisso excluído. Alarme ${before} → ${now}`:'Compromisso excluído.')},
  'pick-day':d=>{ui.agendaDate=d.d;render()},
  'pick-day-week':d=>{ui.agendaDate=d.d;ui.agendaMode='day';render()},
  'agenda-mode':d=>{ui.agendaMode=d.v;render()},
  'cal-nav':d=>{const s=parseISO(ui.agendaDate||todayISO());const c=ui.calMonth||{y:s.getFullYear(),m:s.getMonth()};let m=c.m+ +d.n,y=c.y;if(m<0){m=11;y--}if(m>11){m=0;y++}ui.calMonth={y,m};render()},
  'open-agenda':d=>{ui.agendaDate=d.d;ui.calMonth=null;ui.agendaMode='day';tab('agenda')},
  'open-routes-plan':()=>{ui.rq=null;tab('routes')},
  'open-routes':d=>{const a=st.events.find(e=>e.id===d.from),b=st.events.find(e=>e.id===d.to);ui.rq={from:{...a.location,label:a.location.label||a.name},to:{...b.location,label:b.location.label||b.name},arrive:b.start,margin:b.margin,mode:'all',date:d.d,eventId:b.id};go('routes')},
  'toggle-steps':d=>{ui.expanded[d.m]=!ui.expanded[d.m];render()},
  'use-route':d=>{const p=ui.plan;if(!p){st.selectedMode=d.m;commit(undefined,`Rota padrão: ${MODES[d.m].label}`);return}
    const n=planFor(p.date,{mode:d.m});ui.modal={type:'route',m:d.m,before:{alarm:p.alarm!=null?fmt(p.alarm):'—',dep:fmt(p.depart),dur:p.dur},after:{alarm:n.alarm!=null?fmt(n.alarm):'—',dep:fmt(n.depart),dur:n.dur,arr:fmt(n.arrival)}};render()},
  'confirm-route':d=>{const before=ui.modal.before;st.selectedMode=d.m;ui.modal=null;refresh(`Você escolheu ${MODES[d.m].label.toLowerCase()}.`);const n=nextPlan();toast(`Rota atualizada. Alarme ${before.alarm} → ${n&&n.alarm!=null?fmt(n.alarm):'—'}, saída ${n?fmt(n.depart):''}`)},
  'start-trip':()=>startTrip(),
  'trip-alts':()=>{const T=st.trip;ui.rq=null;tab('routes')},
  'finish-trip':()=>{const T=st.trip;const sc=dataScenario();ui.modal={type:'finish',answer:null,time:fmt(T.depart+duration(T.mode,sc,T.ratio)+(T.extra||0))};render()},
  'finish-ans':d=>{ui.modal.answer=d.v;render()},
  'confirm-finish':()=>{const T=st.trip,M=ui.modal;if(!M.answer){toast('Escolha Sim, Não ou Não informar.');return}
    st.history.unshift({id:uid('h'),date:T.date,dest:T.destLabel,mode:T.mode,planned:T.planned,actual:M.time||'',answer:M.answer});st.trip=null;ui.modal=null;save();ui.stack=[];ui.view='today';toast('Trajeto finalizado e salvo no histórico.')},
  'bf-cat':d=>{ui.bf.cat=d.v;render()}, 'bf-near':()=>{ui.bf.near=!ui.bf.near;render()}, 'bf-reset':()=>{ui.bf={cat:'all',near:false};render()},
  'partners-on':()=>{st.prefs.partners=true;save();render()},
  copy:(d)=>{const done=()=>toast('Cupom copiado.');const fb=()=>{const el=document.getElementById('coupon');const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r);toast('Cupom selecionado. Copie com o atalho do seu aparelho.')};
    try{navigator.clipboard.writeText(d.code).then(done,fb)}catch(e){fb()}},
  'ask-stop':d=>{ui.modal={type:'stop',id:d.id};render()},
  'confirm-stop':d=>{const p=PARTNERS.find(x=>x.id===d.id);const before=st.lastAlarm?.time;const date=ui.plan?.date;
    st.stop=d.leg?{partnerId:p.id,name:p.name,extra:p.extra,keep:true,date,leg:d.leg}:{partnerId:p.id,name:p.name,extra:p.extra,keep:d.keep==='1',date,leg:'commute'};
    ui.modal=null;refresh(`Parada incluída: ${p.name}.`);const n=nextPlan();const now=n&&n.alarm!=null?fmt(n.alarm):null;toast(now&&before&&now!==before?`Parada incluída. Alarme ${before} → ${now}`:'Parada incluída no trajeto.')},
  'remove-stop':(d,el,e)=>{e.preventDefault();st.stop=null;commit('Parada removida.','Parada removida.')},
  'open-notif':d=>{const n=st.notifs.find(x=>x.id===d.id);n.read=true;save();const t=n.target||{};
    if(t.type==='alarm'){openAlarm()}else if(t.type==='route'){ui.rq=null;go('routes')}else if(t.type==='event'&&st.events.find(e=>e.id===t.id)){openEvent(t.id)}else if(t.type==='trip'){if(st.trip)go('trip');else{ui.rq=null;go('routes')}}else render()},
  'read-all':()=>{st.notifs.forEach(n=>n.read=true);save();render()},
  'clear-notifs':()=>{st.notifs=[];save();render()},
  'toggle-notif':d=>{st.prefs.notif[d.k]=!st.prefs.notif[d.k];save();render()},
  'toggle-pref':d=>{st.prefs[d.k]=!st.prefs[d.k];if(d.k==='partners'&&!st.prefs.partners)st.stop=null;commit()},
  'ask-reset':()=>{ui.modal={type:'reset'};render()},
  'confirm-reset':()=>{try{localStorage.removeItem(KEY)}catch(e){} mem=null;st=blankState();ui.modal=null;ui.stack=[];ui.view='welcome';ui.rq=null;ui.agendaDate=null;render(true);toast('Dados locais excluídos.')},
  'ask-clear-history':()=>{ui.modal={type:'clear-history'};render()},
  'confirm-clear-history':()=>{st.history=[];ui.modal=null;save();toast('Histórico apagado.')},
  'edit-place':d=>{const p=d.id?placeById(d.id):null;ui.modal={type:'place',id:p?.id,label:p?.label||'',address:p?.address||''};render()},
  'save-place':()=>{const M=ui.modal;if(!M.label.trim()||!M.address.trim()){M.err='Preencha nome e endereço.';render();return}
    const g=geocode(M.address);if(M.id){const p=placeById(M.id);Object.assign(p,{label:M.label.trim(),address:M.address.trim(),...g});st.events.forEach(e=>{if(e.location?.placeId===p.id)e.location=locFromPlace(p.id)})}else st.places.push({id:uid('pl'),label:M.label.trim(),address:M.address.trim(),...g});
    ui.modal=null;ui.rq=null;commit('Você alterou um local salvo.','Local salvo.')},
  'delete-place':d=>{st.places=st.places.filter(p=>p.id!==d.id);ui.modal=null;ui.rq=null;save();toast('Local removido.')},
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el)return;const f=A[el.dataset.action];if(f){if(el.tagName==='A'&&el.getAttribute('href')==='#')e.preventDefault();f(el.dataset,el,e)}});
document.addEventListener('input',e=>{const el=e.target;if(!el.dataset.bind)return;setPath(ui,el.dataset.bind,readVal(el));if(el.dataset.sugg)showSugg(el)});
document.addEventListener('change',e=>{const el=e.target;
  if(el.dataset.change){const k=el.dataset.change;
    if(k==='travel-min'){st.prefs.travelMin=+el.value;save();toast(`Aviso a partir de ${el.value} min de diferença.`)}
    if(k==='set-name'){st.user.name=el.value.trim();save();toast('Nome atualizado.')}
    if(k==='rq-place'){const v=el.value;if(v.startsWith('p:')){const p=placeById(v.slice(2));ui.rq[el.dataset.k]={...p,placeId:p.id};ui.rq.eventId=null;render()}}
    if(k==='trip-step'){const i=+el.dataset.i;const T=st.trip;T.done=T.done.includes(i)?T.done.filter(x=>x!==i):[...T.done,i];save();render()}
    return}
  if(!el.dataset.bind)return;setPath(ui,el.dataset.bind,readVal(el));
  if(el.type!=='text'&&!el.dataset.sugg)render();});
function showSugg(el){const box=document.getElementById('sugg-'+el.id);if(!box)return;const v=norm(el.value);
  if(v.length<2){box.innerHTML='';return}
  const hits=SUGGEST.filter(s=>norm(s.a).includes(v)).slice(0,5);
  box.innerHTML=hits.map(h=>`<button type="button" data-action="pick-sugg" data-p="${el.dataset.bind}" data-val="${esc(h.a)}">${icon('pin',16)}<span>${esc(h.a)}</span></button>`).join('')+(hits.length?'':`<button type="button" data-action="pick-sugg" data-p="${el.dataset.bind}" data-val="${esc(el.value)}">${icon('pin',16)}<span>Usar “${esc(el.value)}”</span><span class="tag">endereço digitado</span></button>`)+`<button type="button" disabled style="cursor:default;color:var(--faint);font-size:12px">Sugestões simuladas</button>`}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ui.modal){ui.modal=null;render()}});

if(st.prefs){st.prefs.notif=st.prefs.notif||{};if(st.prefs.notif.travel==null)st.prefs.notif.travel=true;if(!st.prefs.travelMin)st.prefs.travelMin=5}
if(st.onboarded&&st.routine)refresh();
render(true);
</script>
</body>
</html>
